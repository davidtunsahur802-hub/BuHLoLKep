name: Build Single C# File

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Используем Windows, так как на ней компилятор csc доступен из коробки
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Compile C# File
        # Замените gemini-code-1791575743889.cs на точное имя файла, если оно другое
        run: csc gemini-code-1791575743889.cs
