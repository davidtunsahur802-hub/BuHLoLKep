name: Build WinForms Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Обязательно используем Windows для сборки графических интерфейсов Windows Forms
    runs-on: windows-latest

    steps:
      # 1. Скачиваем ваш .cs файл из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем официальный .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Автоматически создаем пустой проект Windows Forms
      - name: Create WinForms project file
        run: dotnet new winforms --force

      # 4. Удаляем автоматически сгенерированный шаблонный Form1.cs, чтобы он не конфликтовал с вашим файлом
      - name: Clean template files
        run: |
          if (Test-Path Form1.cs) { Remove-Item Form1.cs }
          if (Test-Path Form1.Designer.cs) { Remove-Item Form1.Designer.cs }

      # 5. Запускаем сборку
      - name: Build project
        run: dotnet build --configuration Release
