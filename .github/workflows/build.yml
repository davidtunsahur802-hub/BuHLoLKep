name: Build Single C# File

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Возвращаемся на быстрый Linux-сервер
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем ваш .cs файл из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем официальный .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Автоматически создаем пустой файл проекта рядом с вашим кодом
      - name: Create temporary project file
        run: dotnet new console --force

      # 4. Запускаем сборку
      - name: Build project
        run: dotnet build --configuration Release
